name: Zadanie agenta Frontend lub Backend z odbiorem QA
description: Jeden rezultat Autervy, wymagania, zależności, CR orkiestratora i odbiór QA.
title: "[Zadanie] "
labels: ["type:task"]
projects: ["KarolR2001/1"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        MVP 3.1 z superadminem i wieloma firmami; zasady w docs/development/WORKFLOW.md.
        Główny orkiestrator koordynuje Frontend, Backend i QA; osobne sesje korzystają z jednego konta GitHub. Role/statusy rozdzielają kolejki, assignees pozostają puste. Podaj źródła, bez sekretów i danych produkcyjnych.
        Gotowy PR i issue otrzymują needs:cr, issue trafia do Review. Orkiestrator wykonuje CR i przekazuje Ready to test do QA. Done dopiero po QA oraz integracji przez orkiestratora.
  - type: dropdown
    id: role
    attributes:
      label: Rola wiodąca
      options:
        - Backend
        - Frontend
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Oczekiwany rezultat i zakres
      description: Co uzyska użytkownik/system; host, rola, moduł, pliki i granice zadania.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Wymagania i źródła
      description: ID C-*, REQ-MVP-*, FR-*, UC/TEST-MVP oraz konkretne dokumenty/decyzje.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Referencja Penpota i stany UI
      description: Link do strony Penpota oraz dokładna nazwa/ID boardu M/D. Nie przepisuj wyglądu komponentów; dla zadania bez UI wpisz „nie dotyczy”.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Zależności, kontrakty i decyzje
      description: Istniejące issue/PR, kontrakt BE/FE, D-xx; jeśli brak, wpisz „brak”. Relację blocked by ustaw osobno.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Kryteria akceptacji
      description: Sprawdzalne zachowania, błędy, uprawnienia i izolacja firm odpowiednio do zakresu.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Założenia i przekazanie dla testera
      description: Commit/build, środowisko, hosty/role, fixture, spełnione zależności i wyniki kontroli. Agent QA odbiera to samo issue; Role pozostaje Frontend/Backend, a sesję wykonawczą zapisuje komentarz przejęcia.
    validations:
      required: true
  - type: textarea
    id: test_cases
    attributes:
      label: Scenariusze testera i oczekiwane wyniki
      description: Konkretne kroki → oczekiwany rezultat, także błędy i uprawnienia. Po CR orkiestratora Ready to test → Test; fail → Re-open do wykonawcy. QA PASS → integracja i Done przez orkiestratora.
      placeholder: |
        1. Warunki i akcja → oczekiwany wynik.
        2. Przypadek błędny → oczekiwany wynik.
    validations:
      required: true
