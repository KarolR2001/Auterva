name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: every job only reads the repository.
permissions:
  contents: read

# New pushes cancel older runs of the same PR. Every other run gets its own group (run_id), so runs on main
# are neither cancelled nor replaced while pending.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Job names below are stable: they are the status-check names for branch protection (docs/development/CI.md).
  quality:
    name: Lint, typecheck, unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec prisma validate
        env:
          DATABASE_URL: postgresql://ci@127.0.0.1:5432/validate_only
      - run: pnpm lint
      - run: pnpm typecheck
      # Unit tests read server config from the environment; obvious placeholders, no service is contacted.
      - run: pnpm test:unit
        env:
          DATABASE_URL: postgresql://ci@127.0.0.1:5432/unit_placeholder
          BETTER_AUTH_SECRET: ci-unit-placeholder-secret-0123456789abcdef
          BETTER_AUTH_URL: http://127.0.0.1:3305

  integration:
    name: Integration (PostgreSQL, S3, bootstrap)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/fixture
      - name: Integration tests (bootstrap on an empty database first)
        run: pnpm test:integration
      - name: Fixture logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-fixture-logs
          path: .local/fixture-9/log/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Build and E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/fixture
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright E2E
        run: pnpm test:e2e
      - name: Playwright report and fixture logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-artifacts
          path: |
            playwright-report/
            test-results/
            .local/fixture-9/log/
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" -o "$RUNNER_TEMP/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full git history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --exit-code 1 .'

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Blocking threshold for production dependencies (#158). Do not lower or drop the gate.
      AUDIT_LEVEL: high
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Audit production dependencies (blocking at ${{ env.AUDIT_LEVEL }})
        run: pnpm audit --prod --audit-level "$AUDIT_LEVEL"

  images:
    name: Container images build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [web, ws, worker, media-worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ${{ matrix.target }} (not pushed)
        run: docker build --target "${{ matrix.target }}" --tag "auterva-${{ matrix.target }}:ci" .
