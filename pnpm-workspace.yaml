allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@16.4.3'
  - '@next/eslint-plugin-next@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - eslint-config-next@16.4.3
  - next@16.4.3
overrides:
  # GHSA-mrhx-c7xc-m3w5 (#158): @serwist/build and @serwist/webpack-plugin 9.5.13 pull zod 4.6.5.
  # Align with the direct zod pin; remove when Serwist ships zod >=4.6.6.
  zod: 4.6.7
  # GHSA-7589-6fvf-x4pw (#443): @prisma/config 7.10.1 pins effect 3.20.0 (ReDoS, fixed in 3.22.1).
  # Same major line 3.x; remove when Prisma ships @prisma/config with effect >=3.22.1.
  effect: 3.22.3
