#:schema https://developers.openai.com/codex/config-schema.json

# Wspólne ustawienia projektu. Nie zapisuj tutaj tokenów, haseł, konfiguracji
# MCP ani ustawień dostawcy — należą do lokalnej konfiguracji użytkownika.
model = "gpt-6-astra"
